name: Build & Release

on:
  push:
    branches: [main, master]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Package.resolved"
      - ".github/workflows/build.yml"
      - "patches/**"
      - "scripts/build-engines.sh"
    tags: ["*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      notarize:
        description: "Sign and notarize (adds up to an hour of Apple queue)"
        type: boolean
        default: false
      force_rebuild:
        description: "Force full engine rebuild (ignore cache)"
        type: boolean
        default: false
      run_performance_tests:
        description: "Run performance regression tests"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Lint and static analysis - runs first as a fast gate
  lint:
    name: SwiftLint
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        run: swiftlint lint --strict --path Sources/ --config .swiftlint.yml
      - name: Run SwiftLint on Tests
        run: swiftlint lint --strict --path Tests/ --config .swiftlint.yml

  # Direct pushes to main only run the unit tests — a fast gate
  test:
    needs: lint
    if: github.event_name == 'push' && github.ref_type == 'branch'
    name: Unit tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: swift test

  # Performance regression tests - run on PRs and manual triggers
  performance:
    needs: lint
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_performance_tests)
    name: Performance tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Run performance tests
        run: |
          swift test --filter PerformanceTests
      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-results
          path: .build/performance-results.json
          retention-days: 30

  build:
    needs: lint
    # PRs validate a single variant; tags and manual runs build BOTH CPU variants
    # (standard = AVX2, noavx2 = pre-AVX2 legacy) and ship a DMG for each. Branch
    # pushes are handled by the test job above, so build is skipped for them.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    name: Build ${{ matrix.variant }} (x86_64)
    runs-on: macos-26
    # Apple's notary queue took 66 min on this account's first submission.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && fromJSON('["standard","noavx2"]') || fromJSON('["standard"]') }}
    env:
      # The no-AVX2 leg lowers the CPU baseline in build-engines.sh and stamps the
      # bundle (make-app.sh) so the updater keeps it on its own release channel.
      TOSH_NO_AVX2: ${{ matrix.variant == 'noavx2' && '1' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect documentation-only PR
        if: github.event_name == 'pull_request'
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE_SHA"...HEAD | grep -Ev '(^|/).*\.md$|^Assets/lang/|^scripts/(extract-strings|check-translations|translation-status|sync-translations)\.py$|^\.github/|^LICENSE$|^\.gitignore$' >/dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache engine builds
        if: github.event_name != 'pull_request' || steps.scope.outputs.build == 'true'
        uses: actions/cache@v5
        with:
          path: vendor
          # Per variant: the two ISA baselines produce different engine binaries.
          # Include engine commit hashes for better cache invalidation.
          key: engines-${{ matrix.variant }}-${{ hashFiles('patches/**/*.patch', 'scripts/build-engines.sh', 'vendor/**/*.commit') }}
          restore-keys: |
            engines-${{ matrix.variant }}-
            engines-

      - name: Run unit tests
        if: github.event_name == 'pull_request' && steps.scope.outputs.build == 'true'
        run: swift test

      - name: Build inference engines (x86_64)
        if: github.event_name != 'pull_request' || steps.scope.outputs.build == 'true'
        shell: zsh {0}
        run: |
          # Use parallel builds for faster CI, incremental builds for cache hits
          export PARALLEL_ENGINES=1
          export FORCE_REBUILD=${{ inputs.force_rebuild && '1' || '0' }}
          ARCH=x86_64 ./scripts/build-engines.sh

      - name: Build app (x86_64)
        if: github.event_name != 'pull_request' || steps.scope.outputs.build == 'true'
        shell: zsh {0}
        run: TOSH_ARCH=x86_64 ./make-app.sh

      # Developer ID signing + notarization, skipped when the secrets are absent.
      # A submission can cost an hour in Apple's queue, so only tags get one;
      # everything else keeps the ad-hoc signature unless a manual run opts in.
      - name: Sign and notarize (if secrets configured)
        id: sign
        if: startsWith(github.ref, 'refs/tags/') || inputs.notarize
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "No signing secrets — keeping ad-hoc signature"
            exit 0
          fi
          echo "$CERT_P12" | base64 -d > /tmp/cert.p12
          security create-keychain -p ci tosh.keychain
          security default-keychain -s tosh.keychain
          security list-keychains -d user -s tosh.keychain login.keychain-db
          security unlock-keychain -p ci tosh.keychain
          security import /tmp/cert.p12 -k tosh.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci tosh.keychain
          IDENTITY=$(security find-identity -v -p codesigning tosh.keychain | grep -oE '"Developer ID Application:[^"]+"' | head -1 | tr -d '"')
          [ -n "$IDENTITY" ] || { echo "::error::the .p12 holds no Developer ID Application identity"; exit 1; }
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

          # Sign inside out: --deep is deprecated and does not apply the hardened
          # runtime to the engine binaries, which notarization rejects.
          APP=dist/ToshLLM.app
          for exe in "$APP/Contents/Resources/bin/"* "$APP/Contents/Resources/bin-image/"* "$APP/Contents/Resources/bin-audio/"*; do
            [ -f "$exe" ] || continue
            case "$exe" in *.metallib) continue;; esac
            codesign --force --timestamp --options runtime -s "$IDENTITY" "$exe"
          done
          codesign --force --timestamp --options runtime -s "$IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          # Name it per variant: the notary history lists submissions by filename.
          ZIP=/tmp/ToshLLM-${{ matrix.variant }}.zip
          ditto -c -k --keepParent "$APP" "$ZIP"
          xcrun notarytool submit "$ZIP" \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" --wait
          xcrun stapler staple "$APP"
          spctl -a -vvv -t exec "$APP"

      # The DMG is only consumed by releases; packaging + uploading it on every
      # push/PR just burns time and artifact storage. Only tags and manual runs
      # ship a DMG. make-dmg.sh reads the bundle's variant to name it (-noavx2).
      - name: Package DMG
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: zsh {0}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [[ "$VERSION" == v* ]] || VERSION="dev-${GITHUB_SHA::7}"
          ./scripts/make-dmg.sh "$VERSION"

      # The app inside is already stapled, but an unsigned disk image still warns
      # on mount, so the DMG gets its own signature and ticket.
      - name: Sign and notarize DMG
        if: steps.sign.outputs.identity != ''
        env:
          IDENTITY: ${{ steps.sign.outputs.identity }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          security unlock-keychain -p ci tosh.keychain
          for dmg in dist/*.dmg; do
            codesign --force --timestamp -s "$IDENTITY" "$dmg"
            xcrun notarytool submit "$dmg" \
              --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" \
              --password "$NOTARY_PASSWORD" --wait
            xcrun stapler staple "$dmg"
            spctl -a -vvv -t open --context context:primary-signature "$dmg"
          done

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: dmg-${{ matrix.variant }}
          path: dist/*.dmg

      - name: Upload build metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-metrics-${{ matrix.variant }}
          path: |
            .build-engines.log
            vendor/*/.build-cache
          retention-days: 7

  # Collect both variants' DMGs and publish one release with both assets, so the
  # updater can pick the matching one per install (AppInfo.isNoAVX2).
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    name: Publish release
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download built DMGs
        uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: dmg-*
          merge-multiple: true

      - name: Checksums
        run: (cd dist && shasum -a 256 *.dmg > checksums.txt && cat checksums.txt)

      # Pull the section for this tag's version out of CHANGELOG.md so the
      # release body shows the human-written notes; generate_release_notes then
      # appends the auto commit/PR list under it.
      - name: Extract changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { p = 1; next }
            p && /^## \[/ { exit }
            p { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section; stamp the Unreleased header before tagging (scripts/release.sh does it)"
            exit 1
          fi
          echo "----- release body -----"; cat release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.dmg
            dist/checksums.txt
          body_path: release-notes.md
          generate_release_notes: true
