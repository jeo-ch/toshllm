name: Sync toshllm to Gitee

on:
  schedule:
    # 定时任务：每 6 小时同步一次 (注意 GitHub 使用的是 UTC 时间)
    # UTC 0点 = 北京时间 8点
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # 允许你在 Actions 页面手动点击运行

jobs:
  sync-to-gitee:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 必须设置为 0，拉取完整的 Git 历史，否则分支同步会缺失

      - name: Sync to Gitee
        run: |
          # 1. 清除可能存在的旧 remote 链接
          git remote remove gitee 2>/dev/null || true
          
          # 2. 添加 Gitee remote 链接
          # 格式：https://<用户名>:<Token>@gitee.com/<用户名>/<仓库名>.git
          # 注意：请确保 GITEE_USERNAME 和 GITEE_TOKEN 已在 Settings -> Secrets 中配置
          git remote add gitee https://${{ secrets.GITEE_USERNAME }}:${{ secrets.GITEE_TOKEN }}@gitee.com/${{ secrets.GITEE_USERNAME }}/toshllm.git
          
          # 3. 推送所有分支 (使用 -f 强制覆盖，确保与 GitHub 一致)
          git push -f gitee --all
          
          # 4. 推送所有标签
          git push -f gitee
