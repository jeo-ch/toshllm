# ToshLLM SwiftLint configuration
# SwiftLint is not bundled; run via: brew install swiftlint && swiftlint lint

disabled_rules:
  - trailing_whitespace          # The project uses Xcode auto-indent
  - todo                         # TODOs are intentional in source
  - cyclomatic_complexity        # Complex server logic is expected
  - function_body_length         # Long functions exist in ChatNative/Server
  - type_body_length             # Large types are common in SwiftUI views
  - file_length                  # Some files are intentionally large
  - force_cast                   # Used in UI code for known types
  - nesting                      # Nested types are used throughout
  - force_try                    # Used in GGUF parsing and known-safe contexts
  - force_unwrapping             # Used in UI code for known types
  - trailing_comma               # Trailing commas are valid Swift and used throughout
  - implicit_optional_initialization  # Style preference; used for Codable models
  - redundant_string_enum_value  # Explicit values used for clarity in models
  - statement_position           # Mixed formatting in large codebase
  - large_tuple                  # Used in internal APIs (stats, benchmarks)
  - function_parameter_count     # Complex functions in server/video/audio code
  - identifier_name              # Single-letter names common in math/loop code
  - control_statement            # Parentheses sometimes used for clarity
  - legacy_swiftui_aspect_ratio  # Existing SwiftUI patterns
  - multiple_closures_with_trailing_closure  # SwiftUI view builder pattern
  - modifier_order               # nonisolated placement varies
  - optional_data_string_conversion  # String(data:) used intentionally
  - redundant_discardable_let    # let _ = used for clarity
  - vertical_whitespace          # Double blanks tolerated
  - vertical_parameter_alignment # Formatting preference
  - switch_case_alignment        # Mixed style in existing code
  - closure_parameter_position   # Closure parameter formatting
  - void_function_in_ternary     # Used in SwiftUI conditionals
  - prefer_for_where             # if-inside-for used intentionally
  - comma_spacing                # Comma formatting
  - opening_brace                # Brace formatting

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - fatal_error_message
  - first_where
  - overridden_super_call
  - private_action
  - private_outlet
  - prohibited_super_call
  - redundant_nil_coalescing
  - sorted_first_last
  - unused_import                # Remove unused imports
  - yoda_condition               # Prefer constant on left side of comparison

excluded:
  - .build
  - DerivedData
  - '*/.build/*'
  - "**/*.generated.swift"

line_length:
  warning: 500
  error: 1000
  ignores_comments: true
  ignores_urls: true

type_name:
  min_length: 2
  max_length: 60

identifier_name:
  min_length:
    warning: 1
  max_length:
    warning: 60
  excluded:
    - id
    - x
    - y
    - z
    - i
    - j
    - k
    - n
    - t
    - db
    - vm
    - ok
    - a
    - b
    - c
    - d
    - f
    - g
    - h
    - l
    - m
    - p
    - q
    - r
    - s
    - v
    - w
    - e
    - u
